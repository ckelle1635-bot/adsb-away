<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Airspace</title><link rel="stylesheet" href="/static/leaflet.css"><link rel="stylesheet" href="/static/style.css"><script defer src="/static/leaflet.js"></script><script defer src="/static/tvnav.js"></script><script defer src="/static/airspace.js"></script><script defer src="/static/app.js"></script></head>
<body><header><div><span class="eyebrow">YOUR RECEIVER · WHEREVER YOU ARE</span><h1>Home Airspace<span class="accent">.</span></h1></div><form method="post" action="/logout"><button>Sign out</button></form></header>
<main><div class="toolbar"><div><span id="status" role="status">Connecting…</span><span id="updated" class="muted"></span></div><div class="actions"><button id="list-toggle" aria-controls="radar-list" aria-expanded="true">Hide list</button><button id="airspace-toggle" aria-pressed="false" title="FAA Class B, C and D airspace">Airspace</button><button id="chart-toggle" aria-pressed="false" title="FAA VFR sectional chart">Sectional</button><button id="tv-toggle" aria-pressed="false">TV mode</button><button id="home" hidden title="Back to your home area">Home</button><button id="fit" data-tv-start>Fit aircraft</button></div></div><section class="dashboard"><div id="map" aria-label="Aircraft map"></div><aside id="radar-list"><div class="aside-head"><h2>On your radar <span id="count">0</span></h2><label class="sr-only" for="search">Search aircraft</label><input id="search" placeholder="Callsign, registration, aircraft…" type="search"></div><div id="aircraft" aria-live="off"><p class="empty">Waiting for your receiver.</p></div></aside></section><footer>Private receiver feed · Altitude in feet · Speed in knots · For situational awareness only</footer></main></body></html>
